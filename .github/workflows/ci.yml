name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # `dev` is here on purpose. Pushes to dev already ran CI, but a *pull
    # request* targeting dev did not — so a branch protection rule requiring
    # these checks on dev would wait forever for a report that never comes,
    # and every PR to dev would be unmergeable with no error to explain it.
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML
          pip install -e .
      
      - name: Run Ruff linter
        run: ruff check src/
      
      - name: Run Ruff formatter check
        run: ruff format --check src/
      
      - name: Run mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: pytest tests/ -v --cov=city_compare --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  example-report:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Create example rent data
        run: |
          mkdir -p data
          echo "commune,loyer_med,departement" > data/loyers_2025.csv
          echo "Lille,12.5,59" >> data/loyers_2025.csv
          echo "Nantes,11.8,44" >> data/loyers_2025.csv
          echo "Lyon,14.2,69" >> data/loyers_2025.csv
          echo "Marseille,13.1,13" >> data/loyers_2025.csv
          echo "Paris,28.5,75" >> data/loyers_2025.csv
          echo "Bordeaux,12.9,33" >> data/loyers_2025.csv
          echo "Toulouse,11.5,31" >> data/loyers_2025.csv
          echo "Nice,15.8,06" >> data/loyers_2025.csv
          echo "Strasbourg,12.1,67" >> data/loyers_2025.csv
          echo "Montpellier,13.4,34" >> data/loyers_2025.csv
      
      - name: Generate example report
        id: report
        run: |
          set +e
          city-compare compare "Lille" "Nantes" \
            --profile profiles/default.yml \
            --rules profiles/default.rules \
            --out report.md \
            --json summary.json \
            --explain
          rc=$?
          set -e

          # This step talks to two third-party services: Nominatim for
          # geocoding and Open-Meteo for weather and air quality. Both are
          # already retried three times with exponential backoff inside the
          # client. When they are still down after that, the run failed for a
          # reason that is nobody's fault here, and on 2026-09-09 that is
          # exactly what happened — Open-Meteo returned a 502 and this job went
          # red with nothing wrong in the code.
          #
          # 75 is EX_TEMPFAIL (see src/city_compare/upstream.py): the CLI uses
          # it, and only it, for "an upstream service was unavailable". Any
          # other non-zero code is a real failure and must still fail the build
          # — that half matters more, because the tempting version of this fix
          # swallows everything and goes green on a genuine bug.
          if [ "$rc" -eq 75 ]; then
            echo "::warning title=Upstream service unavailable::Example report skipped - Nominatim or Open-Meteo was unreachable after retries. Nothing in this repository is broken; re-run the job to try again."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "generated=true" >> "$GITHUB_OUTPUT"
          exit "$rc"
      
      - name: Upload report artifact
        # Skipped rather than uploading an empty artifact when the run above
        # was cut short by an outage.
        if: steps.report.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: |
            report.md
            summary.json
