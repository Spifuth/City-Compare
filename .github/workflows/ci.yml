name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML
          pip install -e .
      
      - name: Run Ruff linter
        run: ruff check src/
      
      - name: Run Ruff formatter check
        run: ruff format --check src/
      
      - name: Run mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: pytest tests/ -v --cov=city_compare --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  example-report:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Create example rent data
        run: |
          mkdir -p data
          echo "commune,loyer_med,departement" > data/loyers_2025.csv
          echo "Lille,12.5,59" >> data/loyers_2025.csv
          echo "Nantes,11.8,44" >> data/loyers_2025.csv
          echo "Lyon,14.2,69" >> data/loyers_2025.csv
          echo "Marseille,13.1,13" >> data/loyers_2025.csv
          echo "Paris,28.5,75" >> data/loyers_2025.csv
          echo "Bordeaux,12.9,33" >> data/loyers_2025.csv
          echo "Toulouse,11.5,31" >> data/loyers_2025.csv
          echo "Nice,15.8,06" >> data/loyers_2025.csv
          echo "Strasbourg,12.1,67" >> data/loyers_2025.csv
          echo "Montpellier,13.4,34" >> data/loyers_2025.csv
      
      - name: Generate example report
        run: |
          city-compare compare "Lille" "Nantes" \
            --profile profiles/default.yml \
            --rules profiles/default.rules \
            --out report.md \
            --json summary.json \
            --explain
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: |
            report.md
            summary.json
