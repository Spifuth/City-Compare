[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "city-compare"
version = "0.1.0"
description = "CLI pour comparer 2 villes françaises et générer un rapport avec score explicable"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NL" }]
keywords = ["cli", "france", "cities", "comparison", "weather", "rent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
city-compare = "city_compare.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/city_compare"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
