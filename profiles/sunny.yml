# ═══════════════════════════════════════════════════════════════════
#  ☀️ PROFIL CHASSEUR DE SOLEIL
# ═══════════════════════════════════════════════════════════════════
#  Priorité absolue à l'ensoleillement et au climat méditerranéen.
#  Idéal pour : retraités, télétravailleurs, amoureux du soleil
# ═══════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────┐
# │  PONDÉRATION DES CRITÈRES                                       │
# └─────────────────────────────────────────────────────────────────┘

weights:
  # 💰 BUDGET (moins important)
  loyer: 0.20              # Prix du loyer au m² (20%)

  # ☀️ MÉTÉO (priorité maximale = 75%)
  ensoleillement: 0.40     # Heures de soleil par an (40%) ⭐ PRIORITÉ
  temperature: 0.20        # Température moyenne annuelle (20%)
  precipitations: 0.15     # Jours de pluie par an (15%)

  # 🌬️ ENVIRONNEMENT
  qualite_air: 0.05        # Indice de qualité de l'air (5%)


# ┌─────────────────────────────────────────────────────────────────┐
# │  SEUILS ET PRÉFÉRENCES                                         │
# └─────────────────────────────────────────────────────────────────┘

preferences:
  # Température idéale plus élevée (climat doux)
  temperature_ideale: 18

  # Seuil pluie plus strict (même une petite pluie compte)
  seuil_pluie_mm: 0.5

  # Tolérance chaleur plus élevée
  seuil_canicule_c: 32


# ┌─────────────────────────────────────────────────────────────────┐
# │  DONNÉES                                                        │
# └─────────────────────────────────────────────────────────────────┘

data:
  fichier_loyers: "data/loyers_2025.csv"
  historique_meteo_mois: 12
